---
layout: default
---
<article>
  <header>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
  </header>

  {{ content }}

  <p style="margin-top: 3rem;"><a href="{{ '/' | relative_url }}">← Back to all posts</a></p>
</article>
