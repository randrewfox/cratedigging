<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    })();
  </script>

  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --link: #0044cc;
      --muted: #666666;
      --border: #e5e5e5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --text: #e0e0e0;
        --link: #66b2ff;
        --muted: #999999;
        --border: #2a2a2a;
      }
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --text: #1a1a1a;
      --link: #0044cc;
      --muted: #666666;
      --border: #e5e5e5;
    }

    [data-theme="dark"] {
      --bg: #121212;
      --text: #e0e0e0;
      --link: #66b2ff;
      --muted: #999999;
      --border: #2a2a2a;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Georgia, serif;
      line-height: 1.65;
      font-size: 1.1rem;
      max-width: 680px;
      margin: 2rem auto;
      padding: 0 1.2rem;
    }

    #theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.25rem 0.55rem;
      font-size: 0.85rem;
      font-family: monospace;
      cursor: pointer;
      border-radius: 4px;
      z-index: 1000;
    }

    #theme-toggle:hover {
      color: var(--text);
      border-color: var(--muted);
    }

    header, footer {
      margin-bottom: 2.5rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    header p {
      margin: 0.2rem 0 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    nav {
      margin-top: 0.5rem;
    }

    nav a {
      margin-right: 1rem;
    }

    a {
      color: var(--link);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    a:hover {
      text-decoration: none;
    }

    ul.post-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    ul.post-list li {
      margin-bottom: 1.2rem;
    }

    time {
      color: var(--muted);
      font-size: 0.9rem;
      width: auto;
    }

    article header {
      margin-bottom: 1.5rem;
    }

    article header h1 {
      margin-bottom: 0.3rem;
    }

    hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 3rem 0;
    }
  </style>
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Toggle theme">theme</button>

  <header>
    <h1><a href="{{ '/' | relative_url }}" style="color: inherit; text-decoration: none;">{{ site.title }}</a></h1>
    <p>{{ site.description }}</p>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <hr>
    <p style="color: var(--muted); font-size: 0.85rem;">© {{ 'now' | date: "%Y" }} {{ site.author }}</p>
  </footer>

  <script>
    (function() {
      const toggleBtn = document.getElementById('theme-toggle');

      function resolveCurrentTheme() {
        const explicit = document.documentElement.getAttribute('data-theme');
        if (explicit) return explicit;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }

      function renderButton(theme) {
        toggleBtn.textContent = theme === 'dark' ? '☀ light' : '☾ dark';
      }

      renderButton(resolveCurrentTheme());

      toggleBtn.addEventListener('click', function() {
        const nextTheme = resolveCurrentTheme() === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', nextTheme);
        localStorage.setItem('theme', nextTheme);
        renderButton(nextTheme);
      });
    })();
  </script>
</body>
</html>
