---
layout: default
---

<div class="posts-stream">
  {% for post in site.posts %}
    <article style="margin-bottom: 4rem;">
      <header>
        <h2 style="margin-bottom: 0.2rem;">
          <a href="{{ post.url | relative_url }}" style="color: inherit; text-decoration: none;">
            {{ post.title }}
          </a>
        </h2>
        <time datetime="{{ post.date | date_to_xmlschema }}" style="display: block; color: var(--muted); font-size: 0.9rem; margin-bottom: 1.2rem;">
          {{ post.date | date: "%B %d, %Y" }}
        </time>
      </header>

      <div class="post-body">
        {{ post.content }}
      </div>

      {% unless forloop.last %}
        <hr style="margin-top: 3.5rem; border: 0; border-top: 1px solid var(--border);">
      {% endunless %}
    </article>
  {% else %}
    <p>No posts yet. Add your first entry in <code>_posts/</code>!</p>
  {% endfor %}
</div>
